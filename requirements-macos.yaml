  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - ipykernel
  - numpy
  - pandas
  - scipy
  - matplotlib
  - plotly
  - pytorch=2.5.*
  - torchvision=0.20.*
  - torchaudio=2.5.*
